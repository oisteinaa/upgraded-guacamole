[package]
name = "rust_transcriber"
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
description = "Standalone HDF5 DAS to SEG-Y / SEG-D transcriber"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
lto = "thin"
