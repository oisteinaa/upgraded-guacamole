; Load explicit DAS_DATABASE_URL, DAS_ARCHIVE_ROOT, DAS_LIVE_SNAPSHOT and
; DAS_ENVIRONMENT into supervisord's environment before enabling this service.
; Apply migration 004 and build web/dist first. No production defaults.
[program:sensnet_app]
command=/home/inst/myenv/bin/python3 -m uvicorn src.Mapui.api:app --workers 2 --host 127.0.0.1 --port 8051
directory=/home/inst/upgraded-guacamole
user=inst
environment=DAS_DATABASE_URL="%(ENV_DAS_DATABASE_URL)s",DAS_ARCHIVE_ROOT="%(ENV_DAS_ARCHIVE_ROOT)s",DAS_LIVE_SNAPSHOT="%(ENV_DAS_LIVE_SNAPSHOT)s",DAS_ENVIRONMENT="%(ENV_DAS_ENVIRONMENT)s"
redirect_stderr=true
stdout_logfile=/home/inst/LOGS/sensnet_app.log
priority=30
autostart=false
autorestart=true
startsecs=10
startretries=3
