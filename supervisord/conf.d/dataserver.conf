; Optional standalone ASGI data endpoint. The main map API already serves these
; routes, so this second listener is not needed for the unified application.
[program:dataserver]
command=/home/inst/myenv/bin/python3 -m uvicorn src.Mapui.api:app --workers 2 --host 127.0.0.1 --port 5000
directory=/home/inst/upgraded-guacamole
user=inst
environment=DAS_DATABASE_URL="%(ENV_DAS_DATABASE_URL)s",DAS_ARCHIVE_ROOT="%(ENV_DAS_ARCHIVE_ROOT)s",DAS_LIVE_SNAPSHOT="%(ENV_DAS_LIVE_SNAPSHOT)s",DAS_ENVIRONMENT="%(ENV_DAS_ENVIRONMENT)s"
redirect_stderr=true
stdout_logfile=/home/inst/LOGS/dataserver.log
priority=10
autostart=false
autorestart=true
startsecs=10
startretries=3
