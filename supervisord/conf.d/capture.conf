; Completed-file notifications. Add verified --lid/--confirm-* and calibrated
; --rules/--legacy-timezone only after validating their semantics on the server.
[program:datacapture]
command=/home/inst/myenv/bin/python3 -m src.Capture.capture_zmq
directory=/home/inst/upgraded-guacamole
user=inst
environment=DAS_DATABASE_URL="%(ENV_DAS_DATABASE_URL)s",DAS_ARCHIVE_ROOT="%(ENV_DAS_ARCHIVE_ROOT)s",DAS_LIVE_SNAPSHOT="%(ENV_DAS_LIVE_SNAPSHOT)s"
redirect_stderr=true
stdout_logfile=/home/inst/LOGS/datacapture.log
priority=20
autostart=false
autorestart=true
startsecs=10
startretries=3
